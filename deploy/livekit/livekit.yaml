# Self-hosted LiveKit (single node). Secrets come from the VPS .env via
# LIVEKIT_KEYS — this file holds no credentials and is safe to commit.
port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Single node behind NAT: advertise the VPS public IP to clients.
  use_external_ip: true

turn:
  enabled: true
  udp_port: 3478
  # TURN/TLS on 443 would cover the strictest firewalls but needs the TLS
  # cert inside this container (shared Caddy volume + cert_file/key_file).
  # v1 ships without it: UDP media + TCP 7881/3478 cover nearly everything.
  # tls_port: 5349

room:
  empty_timeout: 300
  max_participants: 10

logging:
  level: info
